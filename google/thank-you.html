<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

        gtag('js', new Date());
        gtag('config', 'AW-16525015107');

        gtag('event', 'basement_thank_you_view', { page_name: 'Basement Remodeling Thank You | Wolf Carpenters' });

    <style>
        :root {
            --wolf-yellow: #E1BA47;
            --wolf-black: #010101;
            --wolf-white: #FFFFFF;
            --cta-green: #00E676;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
            font-family: "Open Sans", Arial, sans-serif;
            color: var(--wolf-white);
            background:
                linear-gradient(120deg, rgba(1, 1, 1, 0.96), rgba(1, 1, 1, 0.78)),
                url("../images/finished-remodel.webp") center/cover no-repeat;
        }

        .card {
            width: min(100%, 720px);
            padding: clamp(32px, 6vw, 58px);
            border-radius: 8px;
            border: 2px solid rgba(225, 186, 71, 0.6);
            background: rgba(1, 1, 1, 0.82);
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        img {
            width: 170px;
            height: auto;
            margin: 0 auto 28px;
        }

        p.kicker {
            color: var(--wolf-yellow);
            font-family: "Montserrat", sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 0.78rem;
            margin-bottom: 14px;
        }

        h1 {
            font-family: "Montserrat", sans-serif;
            font-size: clamp(2.1rem, 6vw, 4rem);
            line-height: 1;
            margin-bottom: 18px;
        }

        h1 span { color: var(--wolf-yellow); }

        p {
            color: rgba(255, 255, 255, 0.84);
            font-size: 1.08rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        a {
            display: inline-flex;
            min-height: 52px;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 7px;
            background: var(--cta-green);
            border: 2px solid var(--cta-green);
            color: var(--wolf-black);
            font-family: "Montserrat", sans-serif;
            font-weight: 900;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="../logo/brand-logo-wolfcarpenters.webp" alt="Wolf Carpenters">
        <p class="kicker">Request Received</p>
        <h1>Your basement plan <span>starts here.</span></h1>
        <p>Thanks for reaching out. Wolf Carpenters received your request for a basement remodeling estimate and will follow up with the next step for your site visit.</p>
        <a href="tel:+17813364594">Call Wolf Carpenters</a>
